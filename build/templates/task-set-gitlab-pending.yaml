apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: set-gitlab-pending
  namespace: {{ .Values.namespace }}
spec:
  params:
    - name: gitlab_host
      type: string
      default: "{{ .Values.gitlab.host }}"
    - name: project_id
      type: string
    - name: commit_sha
      type: string
  volumes:
    - name: gitlab-token
      secret:
        secretName: gitlab-credentials
  steps:
    - name: set-status
      image: registry.access.redhat.com/ubi9-minimal:latest
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: gitlab-token
          mountPath: /secrets/gitlab-token
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        GITLAB_TOKEN=$(cat /secrets/gitlab-token/token)
        API_URL="https://$(params.gitlab_host)/api/v4/projects/$(params.project_id)/statuses/$(params.commit_sha)"

        set_status() {
          curl -sk \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --data-urlencode "state=$1" \
            --data-urlencode "name=$2" \
            --data-urlencode "description=$3" \
            "${API_URL}" > /dev/null
          echo "$2: $1 — $3"
        }

        set_status "running" "build"           "Building and testing image..."
        set_status "pending" "acs-image-scan"   "Waiting for build to complete"
        set_status "pending" "acs-image-check"  "Waiting for build to complete"
