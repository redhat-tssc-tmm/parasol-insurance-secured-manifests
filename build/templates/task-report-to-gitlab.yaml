apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: report-to-gitlab
  namespace: {{ .Values.namespace }}
spec:
  params:
    - name: gitlab_host
      type: string
      default: "{{ .Values.gitlab.host }}"
    - name: project_id
      type: string
    - name: commit_sha
      type: string
    - name: merge_request_iid
      type: string
    - name: build_status
      type: string
      default: "success"
    - name: scan_status
      type: string
      default: "success"
    - name: check_status
      type: string
      default: "success"
    - name: scan_output
      type: string
      default: "{}"
  volumes:
    - name: gitlab-token
      secret:
        secretName: gitlab-credentials
  steps:
    - name: set-commit-statuses
      image: registry.access.redhat.com/ubi9:latest
      volumeMounts:
        - name: gitlab-token
          mountPath: /secrets/gitlab-token
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        GITLAB_TOKEN=$(cat /secrets/gitlab-token/token)
        GITLAB_HOST="$(params.gitlab_host)"
        PROJECT_ID="$(params.project_id)"
        COMMIT_SHA="$(params.commit_sha)"
        API_URL="https://${GITLAB_HOST}/api/v4/projects/${PROJECT_ID}/statuses/${COMMIT_SHA}"

        # Parse scan output JSON for status descriptions
        SCAN_OUTPUT='$(params.scan_output)'
        SCAN_DESC=$(python3 -c "
        import json
        try:
            data = json.loads('${SCAN_OUTPUT}'.replace(\"'\", \"\"))
            v = data.get('vulnerabilities', {})
            print(f\"Critical: {v.get('critical',0)}, High: {v.get('high',0)}, Medium: {v.get('medium',0)}\")
        except:
            print('Scan completed')
        " 2>/dev/null || echo "Scan completed")

        set_status() {
          local name="$1"
          local state="$2"
          local description="$3"

          curl -sk --fail-with-body \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --data-urlencode "state=${state}" \
            --data-urlencode "name=${name}" \
            --data-urlencode "description=${description}" \
            "${API_URL}" > /dev/null

          echo "Set status '${name}' to '${state}': ${description}"
        }

        BUILD_STATE="$(params.build_status)"
        [ "${BUILD_STATE}" = "Succeeded" ] && BUILD_STATE="success" || BUILD_STATE="failed"
        SCAN_STATE="$(params.scan_status)"
        [ "${SCAN_STATE}" = "Succeeded" ] && SCAN_STATE="success" || SCAN_STATE="failed"
        CHECK_STATE="$(params.check_status)"
        [ "${CHECK_STATE}" = "Succeeded" ] && CHECK_STATE="success" || CHECK_STATE="failed"

        set_status "build" "${BUILD_STATE}" "Image build"
        set_status "acs-image-scan" "${SCAN_STATE}" "${SCAN_DESC}"
        set_status "acs-image-check" "${CHECK_STATE}" "ACS policy check"

    - name: post-mr-note
      image: registry.access.redhat.com/ubi9:latest
      volumeMounts:
        - name: gitlab-token
          mountPath: /secrets/gitlab-token
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        GITLAB_TOKEN=$(cat /secrets/gitlab-token/token)
        GITLAB_HOST="$(params.gitlab_host)"
        PROJECT_ID="$(params.project_id)"
        MR_IID="$(params.merge_request_iid)"
        API_URL="https://${GITLAB_HOST}/api/v4/projects/${PROJECT_ID}/merge_requests/${MR_IID}/notes"

        SCAN_STATUS="$(params.scan_status)"
        CHECK_STATUS="$(params.check_status)"

        SCAN_ICON="✅"
        CHECK_ICON="✅"
        [ "${SCAN_STATUS}" != "Succeeded" ] && SCAN_ICON="❌"
        [ "${CHECK_STATUS}" != "Succeeded" ] && CHECK_ICON="❌"

        SCAN_OUTPUT='$(params.scan_output)'
        NOTE_BODY=$(python3 << 'PYEOF'
        import json, os
        scan_output = os.environ.get("SCAN_OUTPUT", "{}")
        scan_icon = os.environ.get("SCAN_ICON", "")
        check_icon = os.environ.get("CHECK_ICON", "")
        check_status = os.environ.get("CHECK_STATUS", "")

        try:
            data = json.loads(scan_output)
            v = data.get("vulnerabilities", {})
            uv = data.get("unpatched_vulnerabilities", {})
        except:
            v = {}
            uv = {}

        check_result = "PASSED" if check_status == "Succeeded" else "FAILED"

        note = f"""## Security Pipeline Results

### ACS Image Scan {scan_icon}
| Severity | Total | Unpatched |
|----------|-------|-----------|
| Critical | {v.get('critical', 0)} | {uv.get('critical', 0)} |
| High | {v.get('high', 0)} | {uv.get('high', 0)} |
| Medium | {v.get('medium', 0)} | {uv.get('medium', 0)} |
| Low | {v.get('low', 0)} | {uv.get('low', 0)} |

### ACS Policy Check {check_icon}
**Result: {check_result}**
"""
        print(note)
        PYEOF
        )

        export SCAN_OUTPUT CHECK_STATUS="${CHECK_STATUS}" SCAN_ICON CHECK_ICON
        NOTE_BODY=$(SCAN_OUTPUT="${SCAN_OUTPUT}" SCAN_ICON="${SCAN_ICON}" CHECK_ICON="${CHECK_ICON}" CHECK_STATUS="${CHECK_STATUS}" python3 << 'PYEOF'
        import json, os
        scan_output = os.environ.get("SCAN_OUTPUT", "{}")
        scan_icon = os.environ.get("SCAN_ICON", "")
        check_icon = os.environ.get("CHECK_ICON", "")
        check_status = os.environ.get("CHECK_STATUS", "")

        try:
            data = json.loads(scan_output)
            v = data.get("vulnerabilities", {})
            uv = data.get("unpatched_vulnerabilities", {})
        except:
            v = {}
            uv = {}

        check_result = "PASSED" if check_status == "Succeeded" else "FAILED"

        note = f"""## Security Pipeline Results

### ACS Image Scan {scan_icon}
| Severity | Total | Unpatched |
|----------|-------|-----------|
| Critical | {v.get('critical', 0)} | {uv.get('critical', 0)} |
| High | {v.get('high', 0)} | {uv.get('high', 0)} |
| Medium | {v.get('medium', 0)} | {uv.get('medium', 0)} |
| Low | {v.get('low', 0)} | {uv.get('low', 0)} |

### ACS Policy Check {check_icon}
**Result: {check_result}**
"""
        print(note)
        PYEOF
        )

        curl -sk --fail-with-body \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --data-urlencode "body=${NOTE_BODY}" \
          "${API_URL}" > /dev/null

        echo "Posted MR note to MR #${MR_IID}"
