apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: report-to-gitlab
  namespace: {{ .Values.namespace }}
spec:
  params:
    - name: gitlab_host
      type: string
      default: "{{ .Values.gitlab.host }}"
    - name: project_id
      type: string
    - name: commit_sha
      type: string
    - name: merge_request_iid
      type: string
    - name: build_status
      type: string
      default: "Succeeded"
    - name: scan_status
      type: string
      default: "Succeeded"
    - name: check_status
      type: string
      default: "Succeeded"
    - name: scan_output
      type: string
      default: "{}"
    - name: target_url
      type: string
      default: ""
  workspaces:
    - name: source
      optional: true
  volumes:
    - name: gitlab-token
      secret:
        secretName: gitlab-credentials
    - name: report-output
      emptyDir: {}
  steps:
    - name: prepare-report
      image: registry.access.redhat.com/ubi9:latest
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      env:
        - name: SCAN_OUTPUT
          value: $(params.scan_output)
        - name: BUILD_STATUS
          value: $(params.build_status)
        - name: SCAN_STATUS
          value: $(params.scan_status)
        - name: CHECK_STATUS
          value: $(params.check_status)
        - name: TARGET_URL
          value: $(params.target_url)
        - name: WORKSPACE_PATH
          value: $(workspaces.source.path)
      volumeMounts:
        - name: report-output
          mountPath: /tmp/report
      script: |
        #!/usr/bin/env bash
        python3 << 'PYEOF'
        import json, os, sys

        scan_output_str = os.environ.get("SCAN_OUTPUT", "{}")
        build_status = os.environ.get("BUILD_STATUS", "")
        scan_status = os.environ.get("SCAN_STATUS", "")
        check_status = os.environ.get("CHECK_STATUS", "")
        target_url = os.environ.get("TARGET_URL", "")
        ws_path = os.environ.get("WORKSPACE_PATH", "")

        def map_state(s):
            return "success" if s == "Succeeded" else "failed"

        # Parse SCAN_OUTPUT for commit status descriptions
        try:
            so = json.loads(scan_output_str)
            v = so.get("vulnerabilities", {})
        except Exception:
            v = {}
        scan_desc = "Critical: {}, High: {}, Medium: {}".format(
            v.get("critical", 0), v.get("high", 0), v.get("medium", 0))

        check_result = "PASSED" if check_status == "Succeeded" else "FAILED"

        # Read signature verification result
        sig_state = "failed"
        sig_desc = "Signature not verified"
        sig_json_path = os.path.join(ws_path, "signature-results",
                                     "status.json") if ws_path else ""
        if sig_json_path and os.path.isfile(sig_json_path):
            try:
                with open(sig_json_path) as f:
                    sig = json.load(f)
                sig_status = sig.get("status", "")
                if sig_status == "SIGNED":
                    sig_state = "success"
                    sig_desc = "Signed by " + sig.get("signer", sig.get("email", "verified"))
                elif sig_status == "BOT_COMMIT":
                    sig_state = "success"
                    sig_desc = "Automated commit (signature not required)"
                else:
                    sig_state = "failed"
                    sig_desc = "Unsigned commit"
            except Exception:
                pass

        # Commit statuses
        statuses = [
            {"name": "commit-verification", "state": sig_state,
             "description": sig_desc, "target_url": target_url},
            {"name": "build", "state": map_state(build_status),
             "description": "Image build", "target_url": target_url},
            {"name": "acs-image-scan", "state": map_state(scan_status),
             "description": scan_desc, "target_url": target_url},
            {"name": "acs-image-check", "state": map_state(check_status),
             "description": "ACS policy check: " + check_result,
             "target_url": target_url},
        ]
        with open("/tmp/report/statuses.json", "w") as f:
            json.dump(statuses, f)

        # --- Build MR note ---
        lines = []
        lines.append("## 🔀 Merge Request Check Results")
        lines.append("")

        # --- Commit Signature section (first) ---
        sig_json_path = os.path.join(ws_path, "signature-results",
                                     "status.json") if ws_path else ""
        sig_data = None
        if sig_json_path and os.path.isfile(sig_json_path):
            try:
                with open(sig_json_path) as f:
                    sig_data = json.load(f)
            except Exception:
                pass

        if sig_data:
            sig_status = sig_data.get("status", "")
            sig_details = sig_data.get("details", "")
            if sig_status == "SIGNED":
                lines.append("### ✅ Commit Signature")
                lines.append("")
                lines.append(sig_details)
            elif sig_status == "BOT_COMMIT":
                lines.append("### ℹ️ Commit Signature")
                lines.append("")
                lines.append(sig_details)
            elif sig_status == "UNSIGNED":
                lines.append("### ⛔ Commit Signature")
                lines.append("")
                lines.append("⛔ UNSIGNED COMMIT — as per company policy, unsigned code will not be promoted beyond developer sandboxes")
            lines.append("")

        # --- ACS Policy Check section ---
        check_icon = "✅" if check_status == "Succeeded" else "❌"
        lines.append("### {} ACS Policy Check".format(check_icon))
        lines.append("")

        check_json_path = os.path.join(ws_path, "acs-results",
                                       "image-check.json") if ws_path else ""
        check_data = None
        if check_json_path and os.path.isfile(check_json_path):
            try:
                with open(check_json_path) as f:
                    check_data = json.load(f)
            except Exception:
                pass

        if check_data:
            results = check_data.get("results", [])
            if results:
                policies = results[0].get("violatedPolicies", [])
                total_policies = len(policies)
                breaking = [p for p in policies if p.get("failingCheck", False)]
                non_breaking = [p for p in policies
                                if not p.get("failingCheck", False)]

                lines.append("ACS policies evaluated, {} with violations that block merge".format(
                    len(breaking)))
                lines.append("")

                lines.append("<details>")
                lines.append("<summary>Policy Details ({} policies)</summary>".format(
                    total_policies))
                lines.append("")
                lines.append("Policy | Severity | Blocks Merge | Status")
                lines.append("-------|----------|-------------|-------")
                for p in policies:
                    name = p.get("name", "Unknown")
                    severity = p.get("severity", "Unknown")
                    blocks = "Yes" if p.get("failingCheck", False) else "No"
                    status = "❌ Violation" if p.get("failingCheck", False) \
                             else "⚠️ Warning"
                    lines.append("{} | {} | {} | {}".format(
                        name, severity, blocks, status))
                lines.append("")
                lines.append("</details>")
            else:
                lines.append("No policy violations found.")
        else:
            lines.append("**Result: {}**".format(check_result))

        lines.append("")

        # --- ACS Image Scan section (informational) ---
        lines.append("### 🔍 ACS Image Scan")
        lines.append("")

        scan_json_path = os.path.join(ws_path, "acs-results", "image-scan.json") if ws_path else ""
        scan_data = None
        if scan_json_path and os.path.isfile(scan_json_path):
            try:
                with open(scan_json_path) as f:
                    scan_data = json.load(f)
            except Exception:
                pass

        if scan_data:
            summary = scan_data.get("result", {}).get("summary", {})
            vulns = scan_data.get("result", {}).get("vulnerabilities", [])

            sev_order = {"CRITICAL": 0, "IMPORTANT": 1, "MODERATE": 2, "LOW": 3}
            sev_label = {"CRITICAL": "Critical", "IMPORTANT": "Important",
                         "MODERATE": "Moderate", "LOW": "Low"}

            counts = {}
            for sev_key in ["CRITICAL", "IMPORTANT", "MODERATE", "LOW"]:
                total = summary.get(sev_key, 0)
                fixable = 0
                unfixable = 0
                for vv in vulns:
                    if vv.get("cveSeverity") == sev_key:
                        if vv.get("componentFixedVersion", ""):
                            fixable += 1
                        else:
                            unfixable += 1
                counts[sev_key] = {"total": total, "fixable": fixable,
                                   "unfixable": unfixable}

            lines.append("Severity | Total | With available fixes | Without fixes")
            lines.append("---------|-------|---------------------|---------------")
            for sev_key in ["CRITICAL", "IMPORTANT", "MODERATE", "LOW"]:
                c = counts.get(sev_key, {})
                lines.append("{} | {} | {} | {}".format(
                    sev_label[sev_key], c.get("total", 0),
                    c.get("fixable", 0), c.get("unfixable", 0)))
            lines.append("")

            sorted_vulns = sorted(vulns,
                key=lambda x: (sev_order.get(x.get("cveSeverity", ""), 99),
                               x.get("cveId", "")))

            total_vulns = len(sorted_vulns)
            lines.append("<details>")
            lines.append("<summary>CVE Details ({} vulnerabilities)</summary>".format(
                total_vulns))
            lines.append("")
            lines.append("CVE ID | Severity | Component | Version | Fixed in")
            lines.append("-------|----------|-----------|---------|----------")
            for vv in sorted_vulns:
                cve = vv.get("cveId", "N/A")
                sev = sev_label.get(vv.get("cveSeverity", ""), "Unknown")
                comp = vv.get("componentName", "N/A")
                ver = vv.get("componentVersion", "N/A")
                fix = vv.get("componentFixedVersion", "")
                if not fix:
                    fix = "No fix available"
                lines.append("{} | {} | {} | {} | {}".format(
                    cve, sev, comp, ver, fix))
            lines.append("")
            lines.append("</details>")
        else:
            lines.append("Severity | Total | With available fixes | Without fixes")
            lines.append("---------|-------|---------------------|---------------")
            lines.append("Critical | {} | - | -".format(v.get("critical", 0)))
            lines.append("High | {} | - | -".format(v.get("high", 0)))
            lines.append("Medium | {} | - | -".format(v.get("medium", 0)))
            lines.append("Low | {} | - | -".format(v.get("low", 0)))

        with open("/tmp/report/note.md", "w") as f:
            f.write("\n".join(lines))

        print("Report prepared")
        PYEOF
    - name: set-commit-statuses
      image: registry.access.redhat.com/ubi9:latest
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      env:
        - name: GITLAB_TOKEN_PATH
          value: /secrets/gitlab-token/token
        - name: API_URL
          value: "https://$(params.gitlab_host)/api/v4/projects/$(params.project_id)/statuses/$(params.commit_sha)"
      volumeMounts:
        - name: gitlab-token
          mountPath: /secrets/gitlab-token
        - name: report-output
          mountPath: /tmp/report
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        python3 << 'PYEOF'
        import json, subprocess, os

        token = open(os.environ["GITLAB_TOKEN_PATH"]).read().strip()
        api_url = os.environ["API_URL"]
        statuses = json.load(open("/tmp/report/statuses.json"))

        for s in statuses:
            cmd = [
                "curl", "-sk", "-w", "\n%{http_code}",
                "--header", "PRIVATE-TOKEN: " + token,
                "--data-urlencode", "state=" + s["state"],
                "--data-urlencode", "name=" + s["name"],
                "--data-urlencode", "description=" + s["description"],
            ]
            if s.get("target_url"):
                cmd += ["--data-urlencode", "target_url=" + s["target_url"]]
            cmd.append(api_url)

            r = subprocess.run(cmd, capture_output=True, text=True)
            http_code = r.stdout.strip().split("\n")[-1] if r.stdout else "error"
            print("{}: {} - {} (HTTP {})".format(
                s["name"], s["state"], s["description"], http_code))
        PYEOF
    - name: post-mr-note
      image: registry.access.redhat.com/ubi9-minimal:latest
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      volumeMounts:
        - name: gitlab-token
          mountPath: /secrets/gitlab-token
        - name: report-output
          mountPath: /tmp/report
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        GITLAB_TOKEN=$(cat /secrets/gitlab-token/token)
        API_URL="https://$(params.gitlab_host)/api/v4/projects/$(params.project_id)/merge_requests/$(params.merge_request_iid)/notes"
        NOTE_BODY=$(cat /tmp/report/note.md)

        curl -sk -w "\nHTTP %{http_code}" \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --data-urlencode "body=${NOTE_BODY}" \
          "${API_URL}" > /dev/null

        echo "Posted MR note to MR #$(params.merge_request_iid)"
