apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: parasol-insurance-secured-push
  namespace: {{ .Values.namespace }}
spec:
  params:
    - name: git-revision
      type: string
  results:
    - name: ACS_IMAGE_SCAN_OUTPUT
      value: $(tasks.acs-image-scan.results.SCAN_OUTPUT)
    - name: MAVEN_BUILD_OUTPUT
      value: $(tasks.maven-build.results.MAVEN_BUILD_OUTPUT)
    - name: SONAR_SCAN_OUTPUT
      value: $(tasks.sonar-scan.results.SONAR_SCAN_OUTPUT)
    - name: ACS_IMAGE_CHECK_OUTPUT
      value: $(tasks.acs-image-check.results.ACS_IMAGE_CHECK_OUTPUT)
  workspaces:
    - name: source
    - name: basic-auth
    - name: dockerconfig
    - name: sonar-credentials
    - name: maven-cache
  tasks:
    - name: clone-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: "https://{{ .Values.gitlab.host }}/{{ .Values.tenant.username }}/parasol-insurance-secured.git"
        - name: REVISION
          value: $(params.git-revision)
        - name: SSL_VERIFY
          value: "false"
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth
    - name: maven-build
      runAfter:
        - clone-source
      taskRef:
        name: maven-build
      workspaces:
        - name: source
          workspace: source
        - name: maven-cache
          workspace: maven-cache
    - name: sonar-scan
      runAfter:
        - maven-build
      taskRef:
        name: sonar-scan
      params:
        - name: SONAR_HOST_URL
          value: "{{ .Values.sonarqube.host }}"
        - name: SONAR_DASHBOARD_URL
          value: "{{ .Values.sonarqube.dashboardUrl }}"
        - name: SONAR_PROJECT_KEY
          value: parasol-insurance-secured-{{ .Values.tenant.username }}
      workspaces:
        - name: source
          workspace: source
        - name: sonar-credentials
          workspace: sonar-credentials
        - name: maven-cache
          workspace: maven-cache
    - name: build-and-push
      runAfter:
        - sonar-scan
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:latest"
        - name: DOCKERFILE
          value: Containerfile
        - name: TLSVERIFY
          value: "false"
        - name: STORAGE_DRIVER
          value: vfs
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
    - name: acs-image-scan
      runAfter:
        - build-and-push
      taskRef:
        name: acs-image-scan
      params:
        - name: IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:latest"
      workspaces:
        - name: source
          workspace: source
    - name: acs-image-check
      runAfter:
        - build-and-push
      taskRef:
        name: acs-image-check
      params:
        - name: IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:latest"
      workspaces:
        - name: source
          workspace: source
    - name: rollout-restart
      runAfter:
        - acs-image-scan
        - acs-image-check
      taskRef:
        name: rollout-restart
      params:
        - name: DEPLOYMENT
          value: parasol-insurance
        - name: NAMESPACE
          value: {{ .Values.preprodNamespace }}
