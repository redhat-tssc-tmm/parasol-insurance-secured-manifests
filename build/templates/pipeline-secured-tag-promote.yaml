apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: parasol-insurance-secured-tag-promote
  namespace: {{ .Values.namespace }}
spec:
  params:
    - name: git-tag
      type: string
    - name: git-revision
      type: string
    - name: project-id
      type: string
      default: ""
  workspaces:
    - name: source
    - name: basic-auth
    - name: dockerconfig
  tasks:
    - name: get-image-sha
      taskRef:
        name: get-image-sha
      params:
        - name: IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:latest"
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
    - name: ec-validate
      runAfter:
        - get-image-sha
      taskRef:
        name: ec-validate
      params:
        - name: image
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}"
        - name: image_digest
          value: $(tasks.get-image-sha.results.IMAGE_DIGEST)
      workspaces:
        - name: source
          workspace: source
    - name: skopeo-copy
      runAfter:
        - ec-validate
      taskRef:
        name: skopeo-copy
      params:
        - name: SRC_IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:latest"
        - name: DST_IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:$(params.git-tag)"
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
    - name: open-prod-pr
      runAfter:
        - skopeo-copy
      taskRef:
        name: update-prod-manifest
      params:
        - name: IMAGE_DIGEST
          value: $(tasks.get-image-sha.results.IMAGE_DIGEST)
        - name: IMAGE_TAG
          value: $(params.git-tag)
      workspaces:
        - name: source
          workspace: source
  finally:
    - name: report-tag-status
      taskRef:
        name: report-tag-promote-status
      params:
        - name: project_id
          value: $(params.project-id)
        - name: commit_sha
          value: $(params.git-revision)
        - name: git_tag
          value: $(params.git-tag)
        - name: ec_status
          value: $(tasks.ec-validate.status)
        - name: pipeline_status
          value: $(tasks.status)
