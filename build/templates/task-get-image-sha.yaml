apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: get-image-sha
  namespace: {{ .Values.namespace }}
spec:
  params:
    - name: IMAGE
      type: string
      description: Full image reference (registry/org/name:tag) to inspect
  results:
    - name: IMAGE_DIGEST
      description: SHA256 digest of the image
  workspaces:
    - name: dockerconfig
  steps:
    - name: inspect
      image: registry.redhat.io/rhel9/skopeo:latest
      env:
        - name: REGISTRY_AUTH_FILE
          value: $(workspaces.dockerconfig.path)/.dockerconfigjson
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "Inspecting image: $(params.IMAGE)"

        DIGEST=$(skopeo inspect --tls-verify=false --format '{{`{{.Digest}}`}}' "docker://$(params.IMAGE)")
        if [ -z "${DIGEST}" ]; then
          echo "ERROR: Could not get digest for $(params.IMAGE)"
          exit 1
        fi

        echo -n "${DIGEST}" > $(results.IMAGE_DIGEST.path)
        echo "Image digest: ${DIGEST}"
