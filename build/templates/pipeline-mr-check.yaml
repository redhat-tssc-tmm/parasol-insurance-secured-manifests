apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: parasol-insurance-mr-check
  namespace: {{ .Values.namespace }}
spec:
  params:
    - name: git-revision
      type: string
    - name: merge-request-iid
      type: string
    - name: commit-sha
      type: string
    - name: project-id
      type: string
  workspaces:
    - name: source
    - name: basic-auth
    - name: dockerconfig
    - name: maven-cache
  tasks:
    - name: set-pending-status
      taskRef:
        name: set-gitlab-pending
      params:
        - name: project_id
          value: $(params.project-id)
        - name: commit_sha
          value: $(params.commit-sha)
    - name: clone-source
      runAfter:
        - set-pending-status
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: "https://{{ .Values.gitlab.host }}/{{ .Values.tenant.username }}/parasol-insurance-secured.git"
        - name: REVISION
          value: $(params.git-revision)
        - name: SSL_VERIFY
          value: "false"
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth
    - name: verify-commit-signature
      runAfter:
        - clone-source
      taskRef:
        name: verify-commit-signature
      params:
        - name: ENFORCE
          value: "true"
      workspaces:
        - name: source
          workspace: source
    - name: maven-build
      runAfter:
        - verify-commit-signature
      taskRef:
        name: maven-build
      workspaces:
        - name: source
          workspace: source
        - name: maven-cache
          workspace: maven-cache
    - name: build-and-push
      runAfter:
        - maven-build
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:mr-$(params.merge-request-iid)"
        - name: DOCKERFILE
          value: Containerfile
        - name: TLSVERIFY
          value: "false"
        - name: STORAGE_DRIVER
          value: vfs
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
    - name: update-build-complete
      runAfter:
        - build-and-push
      taskRef:
        name: update-gitlab-status
      params:
        - name: project_id
          value: $(params.project-id)
        - name: commit_sha
          value: $(params.commit-sha)
        - name: statuses
          value: '[{"name":"build","state":"success","description":"Image built successfully"},{"name":"acs-image-scan","state":"running","description":"Scanning image for vulnerabilities..."},{"name":"acs-image-check","state":"running","description":"Checking image against policies..."}]'
    - name: acs-image-scan
      runAfter:
        - update-build-complete
      taskRef:
        name: acs-image-scan
      params:
        - name: IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:mr-$(params.merge-request-iid)"
      workspaces:
        - name: source
          workspace: source
    - name: acs-image-check
      runAfter:
        - update-build-complete
      taskRef:
        name: acs-image-check
      params:
        - name: IMAGE
          value: "{{ .Values.registry.host }}/{{ .Values.registry.organization }}/{{ .Values.image.name }}:mr-$(params.merge-request-iid)"
      workspaces:
        - name: source
          workspace: source
  finally:
    - name: report-to-gitlab
      taskRef:
        name: report-to-gitlab
      workspaces:
        - name: source
          workspace: source
      params:
        - name: project_id
          value: $(params.project-id)
        - name: commit_sha
          value: $(params.commit-sha)
        - name: merge_request_iid
          value: $(params.merge-request-iid)
        - name: build_status
          value: $(tasks.build-and-push.status)
        - name: scan_status
          value: $(tasks.acs-image-scan.status)
        - name: check_status
          value: $(tasks.acs-image-check.status)
        - name: scan_output
          value: "{}"
        - name: target_url
          value: "https://backstage-developer-hub-rhdh.{{ .Values.cluster_subdomain }}/catalog/default/component/parasol-insurance-secured-{{ .Values.tenant.username }}/ci"
