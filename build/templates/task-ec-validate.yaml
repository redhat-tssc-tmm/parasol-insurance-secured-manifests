apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ec-validate
  namespace: {{ .Values.namespace }}
  annotations:
    task.output.location: logs
    task.results.format: application/json
    task.results.type: ec
    task.results.key: CONFORMA_OUTPUT
    task.results.container: step-report
spec:
  params:
    - name: image
      type: string
    - name: image_digest
      type: string
    - name: gitlab_host
      type: string
      default: "{{ .Values.gitlab.host }}"
    - name: policy_path
      type: string
      default: "policies/parasol-software-supply-chain"
    - name: certificate_oidc_issuer
      type: string
      default: "https://kubernetes.default.svc"
    - name: certificate_identity
      type: string
      default: "https://kubernetes.io/namespaces/openshift-pipelines/serviceaccounts/tekton-chains-controller"
    - name: rekor_url
      type: string
      default: "http://rekor-server.trusted-artifact-signer.svc"
  results:
    - name: CONFORMA_OUTPUT
      description: Conforma validation result summary for RHDH
  workspaces:
    - name: source
      optional: true
  volumes:
    - name: ec-output
      emptyDir: {}
  steps:
    - name: validate
      image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
      env:
        - name: IMAGE
          value: $(params.image)
        - name: IMAGE_DIGEST
          value: $(params.image_digest)
        - name: GITLAB_HOST
          value: $(params.gitlab_host)
        - name: POLICY_PATH
          value: $(params.policy_path)
        - name: CERTIFICATE_OIDC_ISSUER
          value: $(params.certificate_oidc_issuer)
        - name: CERTIFICATE_IDENTITY
          value: $(params.certificate_identity)
        - name: REKOR_URL
          value: $(params.rekor_url)
      volumeMounts:
        - name: ec-output
          mountPath: /tmp/ec-output
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        echo "Downloading ec and cosign from TAS cli-server..."
        curl -sL http://cli-server.trusted-artifact-signer.svc:8080/clients/linux/ec-amd64.gz \
          | gunzip > /usr/local/bin/ec
        curl -sL http://cli-server.trusted-artifact-signer.svc:8080/clients/linux/cosign-amd64.gz \
          | gunzip > /usr/local/bin/cosign
        chmod +x /usr/local/bin/ec /usr/local/bin/cosign

        echo "Initializing TUF trust root..."
        cosign initialize \
          --mirror="http://tuf.trusted-artifact-signer.svc" \
          --root="http://tuf.trusted-artifact-signer.svc/root.json" 2>/dev/null

        IMAGE_REF="${IMAGE}@${IMAGE_DIGEST}"
        POLICY_URL="git::https://${GITLAB_HOST}/parasol/conforma-policies.git//${POLICY_PATH}?ref=main"

        echo "Validating image: ${IMAGE_REF}"
        echo "Policy: ${POLICY_URL}"

        ec validate image \
          --image "${IMAGE_REF}" \
          --policy "${POLICY_URL}" \
          --certificate-oidc-issuer "${CERTIFICATE_OIDC_ISSUER}" \
          --certificate-identity "${CERTIFICATE_IDENTITY}" \
          --rekor-url "${REKOR_URL}" \
          --output json=/tmp/ec-output/result.json \
          --output text=/tmp/ec-output/result.txt \
          --show-successes \
          --info || EC_EXIT=$?
        EC_EXIT=${EC_EXIT:-0}

        if [ -d "$(workspaces.source.path)" ]; then
          mkdir -p "$(workspaces.source.path)/ec-results"
          cp /tmp/ec-output/result.json "$(workspaces.source.path)/ec-results/" 2>/dev/null || true
          cp /tmp/ec-output/result.txt "$(workspaces.source.path)/ec-results/" 2>/dev/null || true
        fi

        echo -n "${EC_EXIT}" > /tmp/ec-output/exit-code
        echo "EC validation completed (exit code: ${EC_EXIT})"
    - name: summary
      image: registry.access.redhat.com/ubi9-minimal:latest
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: ec-output
          mountPath: /tmp/ec-output
      script: |
        #!/usr/bin/env bash
        cat /tmp/ec-output/result.txt
    - name: report
      image: registry.access.redhat.com/ubi9:latest
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      volumeMounts:
        - name: ec-output
          mountPath: /tmp/ec-output
      script: |
        #!/usr/bin/env bash
        python3 -c "
        import json
        with open('/tmp/ec-output/result.json') as f:
            data = json.load(f)
        components = data.get('components', [])
        for c in components:
            successes = len(c.get('successes', []))
            violations = len(c.get('violations', []))
            warnings = len(c.get('warnings', []))
        result = {
            'success': data.get('success', False),
            'components': len(components),
            'passed': successes,
            'violations': violations,
            'warnings': warnings
        }
        print(json.dumps(result))
        " > $(results.CONFORMA_OUTPUT.path)
        cat /tmp/ec-output/result.json
        EC_EXIT=$(cat /tmp/ec-output/exit-code 2>/dev/null || echo "0")
        exit ${EC_EXIT}
